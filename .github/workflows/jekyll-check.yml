name: Check Docs 

on:
  # Runs on pushes targeting the default branch
  pull_request:
    branches: ["master"]
    paths: 
      - "docs/**"
      - ".github/workflows/**"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm ci

      - name: Lint Markdown
        run: npx markdownlint "docs/**/*.md"



  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ./docs/ghp

      - name: Build with Jekyll
        working-directory: ./docs
        run: bundle exec jekyll build --destination ../_site --config ghp/_config.yml
        env:
          BUNDLE_GEMFILE: ./ghp/Gemfile
