<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Login</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen m-0">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-sm text-center">
        <h2 class="text-gray-800 text-xl font-semibold mb-6">Network Login</h2>
        <form action="/login" method="POST">
            <div class="mb-4 text-left">
                <label for="ssid" class="block mb-1 font-bold text-label text-sm">Network Name (SSID)</label>
                <select id="ssid" name="ssid" required
                    class="w-full px-3 py-3 border border-border rounded-md box-border text-sm text-gray-800 focus:outline-none focus:ring-2 focus:ring-border-focus">
                    <option value="" disabled selected>Loading networks…</option>
                </select>
            </div>
            <div class="mb-4 text-left">
                <label for="password" class="block mb-1 font-bold text-label text-sm">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter Password" required
                    class="w-full px-3 py-3 border border-border rounded-md box-border text-sm focus:outline-none focus:ring-2 focus:ring-border-focus" />
            </div>
            <button type="submit"
                class="w-full py-3 bg-secondary hover:bg-secondary-hover text-white border-none rounded-md text-base cursor-pointer transition-colors duration-300">
                Connect
            </button>
        </form>
        <p class="mt-4 text-xs text-label">Credentials are only sent to this device</p>
    </div>
    <script>
    function loadSsids() {
        fetch('/ssids')
            .then(r => r.json())
            .then(response => {
                const sel = document.getElementById('ssid');
                if (!sel.value) {
                    sel.innerHTML = '<option value="" disabled selected>Select a network</option>';
                    response.ssids.forEach(s => {
                        const name = typeof s === 'string' ? s : s.ssid;
                        const opt = document.createElement('option');
                        opt.value = name;
                        opt.textContent = name;
                        sel.appendChild(opt);
                    });
                }
            })
            .catch(() => {
                const sel = document.getElementById('ssid');
                sel.innerHTML = '<option value="" disabled selected>Could not load networks</option>';
            });
    }
    loadSsids();
    setInterval(loadSsids, 5000);
    </script>
</body>
</html>
