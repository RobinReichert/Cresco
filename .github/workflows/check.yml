name: Check

on:
  # Runs on pull requests targeting the default branch
  pull_request:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read

jobs:

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      docs_changed: ${{ steps.docs_check.outputs.changed }}
      clang_changed: ${{ steps.clang_check.outputs.changed }}
      rust_changed: ${{ steps.rust_check.outputs.changed }}
      camera_changed: ${{ steps.camera_check.outputs.changed }}
      cross_changed: ${{ steps.cross_check.outputs.changed }}
      python_changed: ${{ steps.python_check.outputs.changed }}
      frontend_changed: ${{ steps.frontend_check.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Setup uv
        run: uv sync
      - id: docs_check
        run: uv run python scripts/check_changes.py ${{ github.event.pull_request.base.ref }} 'docs/' '.github/'
      - id: clang_check
        run: uv run python scripts/check_changes.py ${{ github.event.pull_request.base.ref }} '.*\.c' '.*\.h' '.github/'
      - id: rust_check
        run: uv run python scripts/check_changes.py ${{ github.event.pull_request.base.ref }} '.*\.rs' '.github/' 'rust-toolchain.toml'
      - id: camera_check
        run: uv run python scripts/check_changes.py ${{ github.event.pull_request.base.ref }} 'camera/' '.github/'
      - id: cross_check
        run: uv run python scripts/check_changes.py ${{ github.event.pull_request.base.ref }} 'cross/' 'logic/' '.cargo/' '.github/' 'rust-toolchain.toml'
      - id: python_check
        run: uv run python scripts/check_changes.py ${{ github.event.pull_request.base.ref }} '.*\.py' '.github/'
      - id: frontend_check
        run: uv run python scripts/check_changes.py ${{ github.event.pull_request.base.ref }} 'web/' '.github/'

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Setup uv
        run: uv sync
      - name: Check trailing whitespace
        run: uv run pre-commit run trailing-whitespace --all-files
      - name: Check end of file
        run: uv run pre-commit run end-of-file-fixer --all-files
      - name: Check newline
        run: uv run pre-commit run mixed-line-ending --all-files

  check-yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Setup uv
        run: uv sync
      - name: Check yaml
        run: uv run pre-commit run check-yaml --all-files


  lint-docs:
    needs: detect-changes
    if: needs.detect-changes.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Setup uv
        run: uv sync
      - name: Lint Markdown
        run: uv run pre-commit run markdownlint --all-files

  build-docs:
    needs:
      - detect-changes
    if: needs.detect-changes.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Export Drawio diagrams
        uses: rlespinasse/drawio-export-action@v2
        with:
          path: docs/drawio
          format: svg
          output: ../assets/drawio
          remove-page-suffix: true
          action-mode: all

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ./docs/config

      - name: Build with Jekyll
        working-directory: ./docs
        run: bundle exec jekyll build --destination ../_site --config config/_config.yml
        env:
          BUNDLE_GEMFILE: ./config/Gemfile

  fmt-python:
    needs: detect-changes
    if: needs.detect-changes.outputs.python_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pre-commit run ruff-format --all-files

  lint-python:
    needs: detect-changes
    if: needs.detect-changes.outputs.python_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pre-commit run ruff-lint --all-files

  check-tailwind:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Check CSS is up to date
        run: uv run python scripts/check_tailwind.py

  fmt-clang:
    needs: detect-changes
    if: needs.detect-changes.outputs.clang_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pre-commit run clang-format --all-files

  build-camera:
    needs: detect-changes
    if: needs.detect-changes.outputs.camera_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build camera firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: esp32s3
          path: camera

  fmt-rust:
    needs: detect-changes
    if: needs.detect-changes.outputs.rust_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pre-commit run cargo-fmt --all-files

  test-rust:
    needs: detect-changes
    if: needs.detect-changes.outputs.cross_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install nightly
        run: |
          rustup toolchain install nightly
          rustup default nightly
      - name: Test logic
        run: cargo test -p logic

  check-rust:
    needs: detect-changes
    if: needs.detect-changes.outputs.cross_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Install nightly and target
        run: |
          rustup toolchain install nightly
          rustup default nightly
          rustup target add riscv32imc-unknown-none-elf
          rustup component add rust-src
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/app_embedded
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build app_embedded
        run: ./cresco.sh build app_embedded
        env:
          CARGO_TERM_COLOR: always
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/app_embedded/partitions.csv
            build/app_embedded/riscv32imc-unknown-none-elf/release/cross
          if-no-files-found: error

  test-hw:
    needs:
      - detect-changes
      - check-rust
    if: needs.detect-changes.outputs.cross_changed == 'true'
    runs-on: self-hosted
    env:
      PROBE_RS_PROBE: ${{ vars.PROBE_RS_PROBE }}
      MP_PORT: ${{ vars.MP_PORT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: build/app_embedded
      - name: Reset
        run: probe-rs erase --chip esp32c3
      - name: Ping
        run: uv run mpremote connect "$MP_PORT" run tests/client/ping.py
