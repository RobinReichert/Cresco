name: Check Jekyll Build

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ./docs/ghp

      - name: Build with Jekyll
        working-directory: ./docs
        run: bundle exec jekyll build --destination ../_site --config ghp/_config.yml
        env:
          BUNDLE_GEMFILE: ./ghp/Gemfile
