name: Check

on:
  # Runs on pull requests targeting the default branch
  pull_request:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read

jobs:

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      docs_changed: ${{ steps.docs_check.outputs.changed }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Make check_changes.sh executable
        run: chmod +x ./.github/check_changes.sh

      - id: docs_check 
        run: ./.github/check_changes.sh ${{ github.event.pull_request.base.ref }} 'docs/' '.github/'

  lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm install markdownlint-cli

      - name: Lint Markdown
        run: npx markdownlint "docs/**/*.md"

  build:
    needs: 
      - lint
      - detect-changes
    if: needs.detect-changes.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ./docs/ghp

      - name: Build with Jekyll
        working-directory: ./docs
        run: bundle exec jekyll build --destination ../_site --config ghp/_config.yml
        env:
          BUNDLE_GEMFILE: ./ghp/Gemfile
