name: Bug report
description: Report a bug
labels: ["bug"]
body:
  - type: input
    id: title
    attributes:
      label: Short summary
      description: A clear and concise description of what the bug is.
      placeholder: e.g. reboot after 24h uptime
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How do we reproduce this? Be specific.
      placeholder: |
        1. Flash firmware v... to device (model: ...)
        2. Connect device to broker at ...
        3. Let device run for ...
        4. Observe behaviour
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: Describe what should have happened.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened instead?
      placeholder: Describe what happened instead.
    validations:
      required: true

  - type: textarea
    id: ideas
    attributes:
      label: Ideas
      description: Do you have any ideas why?
      placeholder: Explain why this could be happening
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context, screenshots, or logs here.
      placeholder: Paste logs, attach screenshots, or add any other relevant info.
    validations:
      required: false
