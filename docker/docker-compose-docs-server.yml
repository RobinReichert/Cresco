# docker/docker-compose-docs-server.yml
services:
  drawio-export:
    container_name: drawio-export
    image: rlespinasse/drawio-export:latest
    working_dir: /app/drawio
    volumes:
      - ../docs:/app
    command: --output /app/assets/drawio --format svg --remove-page-suffix

  docs-server:
    container_name: docs-server
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /app
    volumes:
      - ../docs:/app/docs
      - ../build:/app/build
    command: sh -c "jekyll serve --source /app/docs --destination /app/build/docs --config /app/docs/config/_config.yml --host 0.0.0.0 --livereload"
    ports: ["4000:4000"]
    environment:
      BUNDLE_GEMFILE: /app/docs/config/Gemfile
