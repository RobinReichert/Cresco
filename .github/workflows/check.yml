name: Check

on:
  # Runs on pull requests targeting the default branch
  pull_request:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read

jobs:

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      docs_changed: ${{ steps.docs_check.outputs.changed }}
      rust_changed: ${{ steps.rust_check.outputs.changed }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - id: docs_check
        run: ./scripts/check_changes.sh ${{ github.event.pull_request.base.ref }} 'docs/' '.github/'
      - id: rust_check
        run: ./scripts/check_changes.sh ${{ github.event.pull_request.base.ref }} 'cross/' 'logic/' '.cargo/' '.github/'

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pre-commit run trailing-whitespace --all-files
      - run: uv run pre-commit run end-of-file-fixer --all-files
      - run: uv run pre-commit run mixed-line-ending --all-files
  lint-docs:
    needs: detect-changes
    if: needs.detect-changes.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lint Markdown
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pre-commit run markdownlint --all-files

  build-docs:
    needs:
      - detect-changes
    if: needs.detect-changes.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export Drawio diagrams
        uses: rlespinasse/drawio-export-action@v2
        with:
          path: docs/drawio
          format: svg
          output: ../assets/drawio
          remove-page-suffix: true
          action-mode: all

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ./docs/config

      - name: Build with Jekyll
        working-directory: ./docs
        run: bundle exec jekyll build --destination ../_site --config config/_config.yml
        env:
          BUNDLE_GEMFILE: ./config/Gemfile

  fmt-rust:
    needs: detect-changes
    if: needs.detect-changes.outputs.rust_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pre-commit run cargo-fmt --all-files

  test-rust:
    needs: detect-changes
    if: needs.detect-changes.outputs.rust_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install nightly
        run: |
          rustup toolchain install nightly
          rustup default nightly
      - name: Test logic
        run: cargo test -p logic

  check-rust:
    needs: detect-changes
    if: needs.detect-changes.outputs.rust_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install nightly and target
        run: |
          rustup toolchain install nightly
          rustup default nightly
          rustup target add riscv32imc-unknown-none-elf
          rustup component add rust-src
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/app_embedded
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run cargo check
        working-directory: ./cross
        run: cargo check --release
        env:
          CARGO_TERM_COLOR: always
          CARGO_TARGET_DIR: build/app_embedded
