<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Login</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 1.5rem; }
        .input-group { margin-bottom: 1rem; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #0056b3; }
        .footer-text { margin-top: 1rem; font-size: 0.8rem; color: #888; }
    </style>
</head>
<body>

        <div class="login-card">
            <h2>Network Login</h2>
            <form action="/login" method="POST">
                <div class="input-group">
                    <label for="ssid">Network Name (SSID)</label>
                    <select id="ssid" name="ssid" required>
                        <option value="" disabled selected>Loading networks…</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter Password" required>
                </div>
                <button type="submit">Connect</button>
            </form>
            <p class="footer-text">Credentials are only sent to this device</p>
        </div>
        <script>
        function loadSsids() { 
            fetch('/ssids')
                .then(r => r.json())
                .then(response => {
                    const sel = document.getElementById('ssid');
                    if (!sel.value) {
                        sel.innerHTML = '<option value="" disabled selected>Select a network</option>';
                        response.ssids.forEach(s => {
                            const name = typeof s === 'string' ? s : s.ssid;
                            const opt = document.createElement('option');
                            opt.value = name;
                            opt.textContent = name;
                            sel.appendChild(opt);
                        });
                    }
                })
                .catch(() => {
                    const sel = document.getElementById('ssid');
                    sel.innerHTML = '<option value="" disabled selected>Could not load networks</option>';
                });
        }
        loadSsids();
        setInterval(loadSsids, 5000);
        </script>
    </body>
</html>
