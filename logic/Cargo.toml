[package]
name = "logic"
version = "0.1.0"
edition = "2024"

[dependencies]
heapless    = "0.8"
defmt       = "1.0.1"
smoltcp     = { version = "0.12.0", default-features = false, 
    features = [
        "defmt",
        "medium-ethernet",
        "multicast",
        "proto-dhcpv4",
        "proto-dns",
        "proto-ipv4",
        "socket-dns",
        "socket-icmp",
        "socket-raw",
        "socket-tcp",
        "socket-udp",
    ] }
